[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kilometer-audio-kite"
version = "0.1.0"
readme = "README.md"
description = "KITE evidence pipeline for the Perception Test 2026 KilometerAudio track"
requires-python = ">=3.11"
dependencies = [
  "modal>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/StarAtNyte/kilometer-audio"
